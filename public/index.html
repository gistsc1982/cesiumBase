<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <link rel="stylesheet" href="<%= BASE_URL %>style.css">
    <!-- Cesium 样式表 -->
    <link rel="stylesheet" href="<%= BASE_URL %>Cesium/Widgets/widgets.css">
    <!-- DualCanvasViewer 样式表 -->
    <link rel="stylesheet" href="<%= BASE_URL %>dual-canvas-viewer.css">
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %></strong> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>

    <!-- 浏览器环境 polyfill -->
    <script>
      window.process = { env: {} };
      window.global = window.globalThis = window;
    </script>

    <!-- ⭐ 关键脚本预加载 -->
    <link rel="preload" href="<%= BASE_URL %>libs/vue.global.js" as="script">
    <link rel="preload" href="<%= BASE_URL %>libs/vue3-sfc-loader.js" as="script">

    <!-- ⭐ ES Module Shims (延迟加载) -->
    <script defer src="<%= BASE_URL %>libs/es-module-shims.js"></script>

    <!-- Cesium 核心库由 webpack 编译提供 (统一版本 1.108，避免版本冲突) -->
    <!-- 注意：旧版 cesiumTdt.js 不兼容 Cesium 1.108，已移除依赖 -->
    <!-- 天地图功能使用 LayerControl.vue 组件实现 -->

    <!-- ⭐ Import Map for ES modules (SFC 加载方式) -->
    <script type="importmap">
    {
      "imports": {
        "vue": "./libs/vue.esm-browser.js",
        "three": "./libs/three.module.js",
        "three/addons/": "./libs/three/addons/",
        "xeokit-sdk": "./libs/xeokit-sdk.min.es.js",
        "web-ifc": "./libs/web-ifc-api.js"
      }
    }
    </script>

    <!-- ⭐ 非关键脚本延迟加载 -->
    <!-- xeokit SDK 包装脚本 (作为模块加载) -->
    <script defer src="<%= BASE_URL %>load-xeokit.js" type="module"></script>

    <!-- Three.js 全局加载脚本 -->
    <script defer src="<%= BASE_URL %>load-three-globals.js" type="module"></script>

    <!-- SyncManager 全局暴露 (必须在插件之前加载) -->
    <script defer src="<%= BASE_URL %>sync-manager-global.js"></script>

    <!-- ⭐ Vue 3 和 SFC Loader (关键，同步加载) -->
    <script src="<%= BASE_URL %>libs/vue3-sfc-loader.js"></script>
    <script src="<%= BASE_URL %>libs/vue.global.js"></script>

    <!-- ⭐ DualCanvasViewer Plugin (同步加载，避免时序问题) -->
    <script src="<%= BASE_URL %>dual-canvas-viewer-plugin.iife.js?v=2.4"></script>

    <!-- SyncManager 桥接脚本 (必须在插件之后加载) -->
    <script src="<%= BASE_URL %>sync-manager-bridge.js"></script>

    <!-- Cesium 与 Dual 组件双向同步脚本 V2 -->
    <script defer src="<%= BASE_URL %>cesium-dual-sync-v2.js"></script>

    <!-- ⭐ DualCanvasViewer 容器由 CesiumMain.vue 模板提供，无需静态定义 -->

    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
