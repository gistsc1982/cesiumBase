<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DualCanvasViewer - ES Module 版本测试</title>
  <link rel="stylesheet" href="./sfcLib/dist/dual-canvas-viewer-sfc/lib/dual-canvas-viewer.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 10px 20px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 500;
    }
    .header .status {
      font-size: 12px;
      color: #4ade80;
    }
    .viewer-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>DualCanvasViewer - ES Module 版本测试</h1>
      <span class="status" v-if="loaded">✓ 组件已加载</span>
      <span class="status" v-else>加载中...</span>
    </div>
    <div class="viewer-container">
      <dual-canvas-viewer></dual-canvas-viewer>
    </div>
  </div>

  <!-- Import Map for ES modules -->
  <script type="importmap">
  {
    "imports": {
      "vue": "../libs/vue.esm-browser.js",
      "three": "../libs/three.module.js",
      "three/addons/": "../libs/three/addons/",
      "xeokit-sdk": "../libs/xeokit-sdk.min.es.js",
      "web-ifc": "../libs/web-ifc-api.js"
    }
  }
  </script>

  <script type="module">
    // 浏览器环境 polyfill
    window.process = { env: {} };
    window.global = window.globalThis = window;

    // 导入 ES Module 版本（现在通过 importmap 可以使用裸模块导入）
    import { createApp } from 'vue';
    import DualCanvasViewer from './sfcLib/dist/dual-canvas-viewer-sfc/lib/dual-canvas-viewer.mjs';

    const app = createApp({
      data() {
        return {
          loaded: true
        };
      }
    });

    // 注册组件
    app.component('dual-canvas-viewer', DualCanvasViewer);
    console.log('[App] ✓ ES Module 组件已注册:', DualCanvasViewer);

    // 挂载 app
    app.mount('#app');
    console.log('[App] ✓ App 已挂载');
  </script>
</body>
</html>
